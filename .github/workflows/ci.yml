name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: [ lua5.3, lua5.4 ]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ${{ matrix.lua }}
        run: sudo apt-get update -qq && sudo apt-get install -y ${{ matrix.lua }}

      - name: Comprobar sintaxis
        run: |
          for f in src/*.lua test/*.lua; do
            luac${{ matrix.lua == 'lua5.3' && '5.3' || '5.4' }} -p "$f"
          done

      - name: Pruebas
        run: ${{ matrix.lua }} test/test-preferred-devices.lua

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck install.sh uninstall.sh

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar los .conf
        run: ./test/check-configs.sh
