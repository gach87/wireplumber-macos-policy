wireplumber.components = [
  { name = preferred-devices.lua, type = script/lua
    provides = custom.preferred-devices }
]

wireplumber.profiles = {
  main = { custom.preferred-devices = required }
}

# Devices whose ARRIVAL must not steal focus. Lua patterns, matched against
# node.name. A matching device still takes part in the preferred list -- you
# can select it by hand and it works as a fallback -- it just does not become
# the default merely by showing up.
#
# This is for nodes that come and go on their own rather than because someone
# did something: network sinks that track a remote host's reachability,
# virtual monitors, loopbacks. Without this, a remote host rebooting would
# yank the audio out of your headphones.
#
# Empty by default. Example:
#
# preferred-devices.no-arrival = [ "^rtp%-", "^network%-audio%-" ]
preferred-devices.no-arrival = [ ]
