# No auto-mute on disconnect: macOS does not do it.
#
# WirePlumber's device/automute-alsa-routes.lua mutes every available ALSA
# output route when a sink that was PLAYING disappears, and never unmutes. The
# intent is "your headphones died, I do not want sound blasting out of the
# speakers".
#
# macOS has no equivalent. Power off your AirPods and playback moves to the
# built-in speakers and keeps going, at the speakers' own volume -- which is
# safe precisely because volume and mute are stored per route, not globally.
# WirePlumber stores them per route too (see ~/.local/state/wireplumber/
# default-routes), so the protection guards against something that cannot
# happen here, at the cost of contradicting the whole point of this component:
# "on disconnect it falls to the next present device".
#
# It also cannot tell apart the two cases it would need to. Powering a device
# off and walking out of range look identical from BlueZ -- both arrive as
# "connection terminated unexpectedly" -- so it is all or nothing.
#
# Both settings default to false upstream. They are set here explicitly so the
# policy is stated rather than inherited, and so a distro that turns them on in
# its own .conf does not silently change the behaviour of this component.
#
# NOTE: a value SAVED into ~/.local/state/wireplumber/sm-settings beats this
# file. Precedence is saved > config > schema default. install.sh clears a
# saved value for these two keys for that reason; to do it by hand:
#
#   wpctl settings device.routes.mute-on-bluetooth-playback-removed --delete
#
# Delete this file if you want the protection back.
wireplumber.settings = {
  device.routes.mute-on-alsa-playback-removed = false
  device.routes.mute-on-bluetooth-playback-removed = false
}
