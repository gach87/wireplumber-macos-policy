# Preferred device profiles, in order. The first one the device actually
# offers wins.
#
# This uses device.profile.priority.rules, WirePlumber's own declarative
# section, so the component does not invent a configuration format. What the
# component adds is imposing it EARLY: WirePlumber overwrites the stored
# profile with whatever it ends up choosing, and once a profile is stored the
# native find-preferred-profile hook skips itself -- so a degraded profile
# sticks forever.
#
# The example below prefers SBC-XQ (higher bitpool, better quality) over plain
# SBC on Bluetooth devices. To see what a device offers:
#
#   pw-cli enum-params <device-id> EnumProfile
#
# Remove or edit this file if you do not want any profile preference.
device.profile.priority.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        priorities = [ "a2dp-sink-sbc_xq", "a2dp-sink" ]
      }
    }
  }
]
