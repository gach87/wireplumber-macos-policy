# Preferir SBC-XQ (bitpool alto) sobre SBC pelado en los audifonos BT.
# El AKG Y500 solo soporta SBC y AAC, y el PipeWire de Debian no trae AAC,
# asi que XQ es la unica mejora de calidad disponible. Se declara aqui en vez
# de repararlo por codigo: 'device.profile.priority.rules' es el mecanismo
# nativo, lo lee device/find-preferred-profile.
device.profile.priority.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = {
      update-props = {
        priorities = [ "a2dp-sink-sbc_xq", "a2dp-sink" ]
      }
    }
  }
]
